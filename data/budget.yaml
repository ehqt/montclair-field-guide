# Montclair Field Guide: how the property tax levy splits.
# Every figure is from the Montclair Township row (MuniCode 0713) of the
# state's 2025 Property Tax Information workbook, "Municipal Tax Summary"
# and "Citizens Tax Summary" sheets, read 2026-10-16. Dollar amounts are
# rounded to the dollar and rates to three decimals. Shares are computed
# from the levies at build time, not stored here.

tax_year: 2025
last_verified: 2026-10-16
sources:
  - &dca
    title: "NJ Department of Community Affairs, 2025 Property Tax Information (Excel)"
    url: "https://www.nj.gov/dca/dlgs/resources/Property_Tax/25_data/25taxes.xls"
  - title: "NJ DCA Division of Local Government Services, Property Tax Information"
    url: "https://www.nj.gov/dca/dlgs/resources/Property_Tax_info.shtml"

net_valuation_taxable: 7212368100
total_rate: 3.516                    # per $100 of assessed value
average_residential_value: 639628    # assessed value, not market value
average_total_taxes: 22487           # before credits and deductions

# `institution` is the id of the body that sets this budget, when it has a
# page or a planned page.
shares:
  - id: schools
    name: Schools
    set_by: the Board of Education
    institution: board-of-education
    pays: >-
      The Montclair Public Schools. The state's workbook splits the school
      levy into the amount required by the district school budget and a
      smaller amount listed as required by the local municipal budget.
    pays_source: *dca
    full_budget:
      text: >-
        The district's proposed 2026-27 budget totals $179,791,339 across all
        funds, with a general fund of $158,905,335. It raises $142,007,176
        from the general fund school levy and puts the total school levy at
        $160,036,615, for an estimated school tax rate of 2.2189.
      source: &mpsuf { title: "Montclair Public Schools, 2026-27 User Friendly Budget (PDF)", url: "https://www.montclair.k12.nj.us/UserFiles/Servers/Server_889476/File/User%20friendly%20budget.pdf" }
    levy: 145594732
    rate: 2.019
    average_taxes: 12912
    lines:
      - { name: District school budget, levy: 137850631 }
      - { name: Required by the local municipal budget, levy: 7744101 }
  - id: township
    name: Township
    set_by: the Township Council
    institution: mayor-and-council
    pays: >-
      The township's own budget for local municipal purposes, plus a
      separate minimum library tax.
    pays_source: *dca
    full_budget:
      text: >-
        The township's 2026 budget as introduced has total general
        appropriations of $106,806,783, down from $110,791,069 in 2025. It
        would raise $64,449,753 for municipal purposes, an estimated
        municipal purpose rate of 0.893 (0.868 in 2025), and $4,271,357 for
        the library.
      source: &twpuf { title: "Township of Montclair, 2026 User Friendly Budget (PDF)", url: "https://www.montclairnjusa.org/files/sharedassets/public/v/2/government/departments/finance-and-taxes/financial-information/annual-user-friendly-budgets/user-friendly-budget-2026.pdf" }
    levy: 66479830
    rate: 0.922
    average_taxes: 5896
    lines:
      - { name: Local municipal purposes, levy: 62590915 }
      - { name: Minimum library tax, levy: 3888915 }
  - id: county
    name: County
    set_by: Essex County
    institution: essex-county
    pays: Essex County's own budget, plus a county open space trust fund.
    pays_source: *dca
    full_budget:
      text: >-
        The 2026 county budget has total appropriations of $905,624,909, of
        which $468,435,000 is raised by county purpose taxes across all
        Essex County towns.
      source: { title: "Essex County 2026 budget (PDF)", url: "https://essexcountynj.org/wp-content/uploads/2026/05/2026-County-Budget.pdf" }
    levy: 41484208
    rate: 0.575
    average_taxes: 3679
    lines:
      - { name: County purposes, levy: 39715379 }
      - { name: County open space trust fund, levy: 1768829 }

# How a budget gets adopted. Each step states only what its sources say.
process:
  - title: The Board of Education adopts the school budget in spring
    body: >-
      The district's 2026-27 budget calendar planned town hall meetings and
      student and staff sessions in January and February, and budget
      presentations at board meetings on February 9, February 25 and March
      11. The board was to adopt a tentative budget on March 18 (the
      calendar prints the year as 2025) and send it to the county March 19,
      for approval by the Executive County Superintendent April 21. The
      public hearing was set for April 29 at 6:30 pm and adoption of the
      final budget for May 6, ahead of the May 14 deadline.
    sources:
      - &mpscal { title: "Montclair Public Schools, SY 26-27 Budget Calendar (PDF)", url: "https://www.montclair.k12.nj.us/UserFiles/Servers/Server_889476/File/Budget%20calendar%2026-27SY%20(f).pdf" }
      - { title: "Budget 2026-2027 (district page)", url: "https://www.montclairps.org/departments/business_office/budget_2025-2026" }
  - title: The Township Council introduces and adopts its budget in spring
    body: >-
      The interim Chief Financial Officer presented the 2026 budget to the
      Council on March 24, 2026. The Council approved the 2026 budget on introduction on April 7, 2026,
      by a 7-0 vote, with the budget to be posted on the township website
      on April 10. The notice set the public hearing for May 5, 2026 at
      8:00 pm, when taxpayers and other interested persons could present
      objections. The Council adopted the budget at its May 5 meeting. The
      introduced budget's general appropriations include debt service,
      which the form labels as including school purposes.
    sources:
      - { title: "Important Dates & Info for the 2026 Municipal Budget (township page)", url: "https://www.montclairnjusa.org/News-articles/Important-Dates-Info-for-the-2026-Municipal-Budget" }
      - { title: "Township of Montclair, 2026 introduced budget (PDF)", url: "https://www.montclairnjusa.org/files/sharedassets/public/v/1/government/departments/finance-and-taxes/financial-information/adopted-budgets/2026-montclair-certified-introduced-budget.pdf" }
  - title: The county's budget runs on its own calendar
    body: >-
      The Board of County Commissioners approved the 2026 county budget on
      March 4, 2026 and set its public hearing for March 25, 2026 at 5:00
      pm at the Hall of Records in Newark. Adoption was listed for second
      reading and public hearing on the board's March 25 agenda and again
      on its April 15 agenda. The budget raises $468,435,000 in county
      purpose taxes across all Essex County towns, up from $460,435,000 in
      2025.
    sources:
      - { title: "Essex County 2026 budget (PDF)", url: "https://essexcountynj.org/wp-content/uploads/2026/05/2026-County-Budget.pdf" }
      - { title: "County commissioners' agenda, March 25 2026 (PDF)", url: "https://ecode360.com/ES1525/document/753241978.pdf" }
      - { title: "County commissioners' agenda, April 15 2026 (PDF)", url: "https://ecode360.com/ES1525/document/753246666.pdf" }
  - title: The levies become tax rates
    body: >-
      Each rate is its levy divided by the township's total taxable
      valuation, stated per $100. In 2025, $253.6 million in levies over
      $7.21 billion in taxable value gave the total rate of 3.516.
    sources: [*dca]
process_note: >-
  The figures on this page for the township's 2026 budget are from the
  introduced budget.

