# Montclair Field Guide: things that come round every year.
# Regular meetings are not listed here; the calendar page reads those from
# each institution file. Each entry states only what its sources say, with
# the 2026 dates as the example.

- when: March
  kind: Budget
  title: County budget approval and public hearing
  note: >-
    In 2026 the Board of County Commissioners approved the county budget
    March 4 and set the public hearing for March 25 at 5:00 pm at the Hall
    of Records in Newark.
  institution: essex-county
  sources:
    - { title: "Essex County 2026 budget (PDF)", url: "https://essexcountynj.org/wp-content/uploads/2026/05/2026-County-Budget.pdf" }
- when: February to May
  kind: Budget
  title: School budget presentations, hearing and adoption
  note: >-
    In 2026 the district's calendar planned Board of Education budget
    presentations on February 9, February 25 and March 11, adoption of a
    tentative budget on March 18, a public hearing on April 29 at 6:30 pm,
    and adoption of the final budget on May 6.
  institution: board-of-education
  sources:
    - { title: "Montclair Public Schools, SY 26-27 Budget Calendar (PDF)", url: "https://www.montclair.k12.nj.us/UserFiles/Servers/Server_889476/File/Budget%20calendar%2026-27SY%20(f).pdf" }
- when: April and May
  kind: Budget
  title: Township budget introduction, hearing and adoption
  note: >-
    In 2026 the Township Council approved the budget on introduction on
    April 7, set the public hearing for May 5 at 8:00 pm, and adopted the
    budget at its May 5 meeting.
  institution: mayor-and-council
  sources:
    - { title: "Important Dates & Info for the 2026 Municipal Budget (township page)", url: "https://www.montclairnjusa.org/News-articles/Important-Dates-Info-for-the-2026-Municipal-Budget" }
    - { title: "Township of Montclair, 2026 introduced budget (PDF)", url: "https://www.montclairnjusa.org/files/sharedassets/public/v/1/government/departments/finance-and-taxes/financial-information/adopted-budgets/2026-montclair-certified-introduced-budget.pdf" }
- when: Before May 1
  kind: Deadline
  title: Property tax assessment appeals
  note: >-
    To appeal your property's assessed value, file a formal appeal with the
    Essex County Board of Taxation. The township says it must be received
    before May 1.
  institution: essex-county
  sources:
    - { title: "Tax and Property Assessment Q&A (township page)", url: "https://www.montclairnjusa.org/Government/Departments/Finance-and-Taxes/Tax-and-Property-Assessment-QA" }
- when: February, May, August, November
  kind: Deadline
  title: Quarterly property tax payments
  note: >-
    The township lists the due dates as February 1, May 1, August 1 and
    November 1, with a 10-day grace period. Late payments are charged
    interest of 8% on the first $1,500 and 18% above that, back to the first
    of the month.
  sources:
    - { title: "Tax and Property Assessment Q&A (township page)", url: "https://www.montclairnjusa.org/Government/Departments/Finance-and-Taxes/Tax-and-Property-Assessment-QA" }
- when: November
  kind: Election
  title: General election
  note: >-
    In 2026 it is Tuesday, November 3, with polls open 6:00 am to 8:00 pm.
    Early voting runs October 24 to November 1 at any of the county's
    early voting sites. Montclair's ballot includes one Councilmember At
    Large seat and three Board of Education seats, in separate municipal
    and school sections where every candidate is nominated by petition,
    along with the County Executive, four at-large county
    commissioners, the District 5 commissioner and U.S. Senate. Montclair
    is split between the 10th and 11th Congressional Districts, so the
    House race depends on where you live.
  sources:
    - { title: "Essex County Clerk, 2026 Official General Election Sample Ballots (PDF)", url: "https://www.essexclerk.com/_Content/pdf/Essex-2026-Sample-Ballots.pdf" }
    - { title: "Essex County Clerk, Guide to Voting, 2026 General Election (PDF)", url: "https://www.essexclerk.com/_Content/pdf/GUIDE-TO-VOTING-GENERAL-2026.pdf" }
