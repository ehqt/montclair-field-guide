# Montclair Field Guide: one institution file
# From the township's Complete Streets Oversight Board page, read in a
# browser 2026-10-16.

id: complete-streets-oversight-board
name: Complete Streets Oversight Board
aliases: [Complete Streets, Vision Zero, Pedestrian safety, Bicycle safety]
category: township-government

summary: >
  A nine-member board of township staff, police, Council members and two
  members of the public. It prioritizes transportation projects and
  recommends pedestrian and bicycle safety policies to the Council.
powers:
  # From the board's page, citing Article X of the Township Code.
  - Review transportation project checklists and comment on Complete Streets checklists submitted to the Planning Board
  - Identify priority transportation projects through the prioritization process in § 297-63
  - Study and recommend policies and initiatives to the governing body, including on pedestrian and bicycle safety
limits:
  - null   # TO VERIFY

how_seated: >-
  Established by Ordinance O-25-13 in May 2025. Up to five municipal staff
  appointed by the Township Manager, including the Complete Streets Director
  as Chair; one member of the Police Department Traffic Safety Bureau
  appointed by the Chief of Police; up to three Governing Body members
  appointed by the Governing Body; and two members of the public appointed
  by the Governing Body for two-year terms.
seated_source: { title: "Complete Streets Oversight Board (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Complete-Streets-Oversight-Board" }
appointed_by: The Township Manager, the Chief of Police and the Township Council
reports_to: null

