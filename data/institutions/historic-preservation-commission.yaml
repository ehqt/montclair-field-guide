notes:
  - title: What is protected
    body: >-
      Montclair has four locally landmarked historic districts (Town Center,
      Upper Montclair, Pine Street and Watchung Plaza) and 64 individually
      designated landmarks. It also has six National and State Registered
      Historic Districts. The commission was established by ordinance in
      1994.
    sources:
      - { title: "Historic Preservation Commission (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Historic-Preservation-Commission" }

