# Montclair Field Guide: one institution file
# From the township's Historic Preservation Commission, Members and Schedule
# of Meetings pages, read in a browser 2026-10-16.

id: historic-preservation-commission
name: Historic Preservation Commission
aliases: [HPC, MHPC, Historic Commission, Certificate of Appropriateness, Landmark]
category: land-use

summary: >
  A commission of seven members and two alternates, appointed by the Mayor.
  It reviews changes to properties in Montclair's local historic districts
  and to its individual landmarks, and proposes new landmarks to the
  Township Council.
powers:
  # From the commission's page.
  - Survey, research and evaluate buildings, sites and districts for their historic significance
  - Propose properties worthy of landmark designation to the Township Council
  - Review and approve changes to properties in the local historic districts and to all other local landmark properties
  - Advise the Planning Board and the Township Council on matters that may affect historic buildings, sites or districts
limits:
  - null   # TO VERIFY

how_seated: >-
  Appointed by the Mayor under Montclair Code § 347-130. The seven regular
  members must include at least one from each of three classes, with no
  fewer than three from Classes A and B: Class A, knowledgeable in building
  design and construction or architectural history; Class B, with a shown
  knowledge of or interest in local history; Class C, a Montclair citizen
  holding no other municipal office, position or employment. Class A and B
  members may live outside the township. The commission elects its own
  officers.
seated_source: { title: "Historic Preservation Commission, Members (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Historic-Preservation-Commission/Members" }
appointed_by: The Mayor
reports_to: null

