how_to_engage:
  public_comment: null
  notice: >-
    Agendas, pending application materials and minutes are posted on the
    commission's pages. The Department of Planning & Community Development
    staffs the commission.
  apply:
    where: >-
      To alter the appearance of a locally landmarked property, complete an
      Application for a Certificate of Appropriateness. To suggest a building
      for landmark designation, call the township representative.
  contact:
