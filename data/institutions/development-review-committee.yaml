id: development-review-committee
name: Development Review Committee
aliases: [DRC, Site plan review, Minor site plan]
category: land-use

summary: >
  A five-member committee that reviews every site plan application going to
  the Planning Board or the Zoning Board of Adjustment, and itself decides
  minor site plans that need no variances.
powers:
  # From the committee's page.
  - Review site plan applications for compliance with the township's zoning requirements, development regulations and design standards
  - Make recommendations on the design and technical elements of any application
  - Hold public hearings on and approve Applications for Development seeking minor site plan approval with no variance requests
limits:
  - null   # TO VERIFY

how_seated: >-
  Under Montclair Code § 202-10.2: two Planning Board members (one may be the
  Mayor) appointed by the Planning Board Chair, one Zoning Board of
  Adjustment member appointed by that board's Chair, the Planning Director
  and the Board Engineer. Terms are one year from January 1.
seated_source: { title: "Development Review Committee, Members (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Development-Review-Committee/Members" }
appointed_by: The chairs of the Planning Board and the Zoning Board of Adjustment
reports_to: null

