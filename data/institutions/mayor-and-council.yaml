# Montclair Field Guide: one institution file
# From the township's Mayor & Township Council, Council-Manager Form of
# Government, Council Meeting Schedule, Office of the Township Manager and
# Find Your Ward pages (read in a browser 2026-10-16), and the Essex County
# Clerk's 2026 sample ballot.

id: mayor-and-council
name: Mayor and Township Council
aliases: [Township Council, Council, Mayor, Governing body, Montclair Township Council]
category: township-government

summary: >
  Montclair's governing body: a Mayor and six councilors (two at large and
  one from each of the four wards). Under the council-manager plan the
  Council sets all policy and hires the Township Manager, who runs the
  township day to day.
powers:
  # From the township's Council-Manager Form of Government page.
  - Hold all powers of the municipality and decide all matters of policy, except as the Faulkner Act or general law provide otherwise
  - Appoint the Township Manager, and suspend or remove the Manager by a majority vote
  - Appoint most members of the Planning Board and all members of the Zoning Board of Adjustment
limits:
  - The Mayor has no executive powers beyond a few appointments, such as the library trustees and the Historic Preservation Commission; the Mayor presides over the Council and votes as one of its members

how_seated: >-
  Elected by voters. The Mayor is elected directly by the voters to a
  four-year term. Councilors serve four-year terms that run concurrently,
  so all expire at the same time except for vacancies.
seated_source: { title: "Council – Manager Form of Government (township page)", url: "https://www.montclairnjusa.org/Government/Mayor-Township-Council/Council-Manager-Form-of-Government" }
appointed_by: null
reports_to: null
appoints: [Township Manager, Planning Board (Class III and IV members), Zoning Board of Adjustment]

