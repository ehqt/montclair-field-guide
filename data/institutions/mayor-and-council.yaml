notes:
  - title: The council-manager plan
    body: >-
      Montclair operates under the Optional Municipal Charter Law, known as
      the Faulkner Act, and voted in 1980 to adopt its council-manager plan.
      The Council is the only directly elected center of power. The
      Township Manager is the chief executive and administrative officer,
      appointed by the Council, and carries out the Council's will. The
      Deputy Township Manager, Chief Financial Officer, department
      directors and other staff report to the Manager.
    sources:
      - { title: "Council – Manager Form of Government (township page)", url: "https://www.montclairnjusa.org/Government/Mayor-Township-Council/Council-Manager-Form-of-Government" }
      - { title: "Office of the Township Manager (township page)", url: "https://www.montclairnjusa.org/Government/Office-of-the-Township-Manager" }
  - title: Wards
    body: >-
      The township is divided into four wards, each electing one councilor.
      The Township Clerk keeps the ward map, and the township's interactive
      ward viewer finds the ward for an address.
    sources:
      - { title: "Find Your Ward (township page)", url: "https://www.montclairnjusa.org/Government/Mayor-Township-Council/Find-Your-Ward" }
  - title: On the November 3, 2026 ballot
    body: >-
      One Councilmember At Large seat is on Montclair's 2026 general
      election ballot, in the municipal election section, where candidates are nominated by petition.
    sources:
      - { title: "Essex County Clerk, 2026 Official General Election Sample Ballots (PDF), Township of Montclair pages", url: "https://www.essexclerk.com/_Content/pdf/Essex-2026-Sample-Ballots.pdf" }

