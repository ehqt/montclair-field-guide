# Montclair Field Guide: one institution file
# From the township's Civil Rights Commission, CRC Members, Meeting Dates
# and FAQs pages, read in a browser 2026-10-16.

id: civil-rights-commission
name: Civil Rights Commission
aliases: [CRC, Montclair Civil Rights Commission]
category: township-government

summary: >
  An advisory board to the Township Council. It recommends programs to end
  discrimination, addresses tensions in the community and reviews the
  Township's Affirmative Action Policy.
powers:
  # From the commission's page and FAQs.
  - Advise the Township Council, to which it reports
  - Recommend programs designed to eliminate discrimination
  - Address problems involving tensions in the community
  - Review the Township Affirmative Action Policy
  - Provide a forum for raising civil rights issues in Montclair
limits:
  - It does not make arrests, employment decisions or appointments to other bodies, hold hearings or issue rulings, provide legal services or enforce the law

how_seated: >-
  The commission's FAQs say it has 17 members, including a Montclair State
  University student and a local high school student, with liaisons to the
  police and the schools. All commissioners must live in Montclair, and the
  Township Council handles open and pending appointments.
seated_source: { title: "Civil Rights Commission FAQs (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Civil-Rights-Commission/Civil-Rights-Commission-FAQs" }
appointed_by: The Township Council
reports_to: The Township Council

