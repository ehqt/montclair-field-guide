how_to_engage:
  public_comment: >
    Each meeting has a slot for public comment on civil rights issues in
    Montclair, typically starting at 7:00 pm. The commission asks speakers to
    fill in its public comment form, email or call at least 48 hours ahead,
    and gives them priority; others may speak after.
  contact:
    phone: 973-307-0366
    email: civilrightscommission@montclairnjusa.org

