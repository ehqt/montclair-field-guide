# Montclair Field Guide: one institution file
# From the township's Landlord-Tenant Advisory Committee page, read in a
# browser 2026-10-16. The page quotes Resolution R-21-247.

id: landlord-tenant-advisory-committee
name: Landlord-Tenant Advisory Committee
aliases: [LTAC, Rental housing, Tenants, Landlords]
category: township-government

summary: >
  A nine-member committee appointed by the Township Council that reviews
  rental housing issues, recommends improvements to the Council, and
  answers questions from tenants and landlords.
powers:
  # From Resolution R-21-247, as quoted on the committee's page.
  - Monitor and review rental housing issues and make recommendations to the Township Council
  - Respond to inquiries from tenants and landlords, explain rights and obligations, and point them to information and help, including mediation services
limits:
  - It does not give legal advice or take part in any formal dispute resolution, including mediation
  - Its procedural rules are subject to the Township Council's approval

how_seated: >-
  Appointed by resolution of the Township Council for three-year staggered
  terms, three a year. At least four members must be tenants and two
  landlords. The committee elects its own chair, vice chair and recording
  secretary.
seated_source: { title: "Landlord-Tenant Advisory Committee (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Landlord-Tenant-Advisory-Committee" }
appointed_by: The Township Council
reports_to: The Township Council
