# Montclair Field Guide: one institution file
# From the township's Zoning Board of Adjustment, Members and Schedule of
# Meetings pages, read in a browser 2026-10-16.

id: board-of-adjustment
name: Zoning Board of Adjustment
aliases: [Board of Adjustment, ZBA, Zoning Board, Variance, Use variance]
category: land-use

summary: >
  A land use board of seven members and up to four alternates. It hears
  appeals of zoning decisions, interprets the zoning ordinance and map, and
  decides variance requests.
powers:
  # From the board's page, citing N.J.S.A. 40:55D-70 and Montclair Code § 202-21.
  - Hear appeals when a party believes the administrative officer made a mistake in enforcing the zoning ordinance
  - Interpret the zoning ordinance and zoning map
  - Decide "C" variances, either for constraints of the property (size, shape, topography) or where the deviation would advance the purposes of the Municipal Land Use Law
  - Decide "D" (use) variances for special reasons, such as a use not allowed in the district, an increase in floor area or density, or extra height
limits:
  - A "D" variance needs the votes of at least 5 members
  - No member may hold an elective office or a position with the municipality

how_seated: >-
  Appointed by the Township Council. Members serve four-year terms and must
  live in Montclair. Up to four alternates serve two-year terms.
seated_source: { title: "Zoning Board of Adjustment, Members (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Zoning-Board-of-Adjustment/Members" }
appointed_by: The Township Council
reports_to: null
member_terms: 4 years; alternates 2 years

