# Montclair Field Guide: one institution file
# From the township's Planning Board, Members and Schedule of Meetings
# pages, read in a browser 2026-10-16.

id: planning-board
name: Planning Board
aliases: [Montclair Planning Board, Master Plan, Site plan, Subdivision]
category: land-use

summary: >
  A land use board of nine members and two alternates. It prepares the
  Township Master Plan, reviews site plan and subdivision applications, and
  advises the Council on changes to the land use ordinance.
powers:
  # From the Planning Board page.
  - Prepare, adopt or amend the Township Master Plan
  - Review applications for development for site plan and subdivision approval
  - Make recommendations to the Township Council on proposed changes to the land use ordinance
  - Grant conditional use or bulk variances in association with subdivision and site plan applications
limits:
  - null   # TO VERIFY

how_seated: >-
  Members come from four classes: the Mayor or the Mayor's designee (Class
  I), a municipal official appointed by the Mayor (Class II), a member of
  the Council appointed by the Council (Class III), and six citizens
  appointed by the Council (Class IV). The Council also appoints the two
  alternates.
seated_source: { title: "Planning Board, Members (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Planning-Board/Members" }
appointed_by: The Township Council, except the Class I and Class II members
reports_to: null

