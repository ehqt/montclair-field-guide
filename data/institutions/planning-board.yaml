notes:
  - title: Regular and workshop meetings
    body: >-
      Applications for development are heard at "Regular" meetings, the
      first meeting of the month. "Workshop" meetings, the second meeting
      of the month, cover other planning initiatives, including
      redevelopment plans. The Department of Planning & Community
      Development staffs the board, which is established under Montclair
      Code Chapter 202, Article I.
    sources:
      - { title: "Planning Board, Schedule of Meetings (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Planning-Board/Schedule-of-Meetings" }
      - { title: "Planning Board (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Planning-Board" }

