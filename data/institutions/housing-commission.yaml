# Montclair Field Guide: one institution file
# From the township's Housing Commission, Members and Meeting Schedule
# pages, read in a browser 2026-10-16.

id: housing-commission
name: Housing Commission
aliases: [MHC, Montclair Housing Commission, Affordable housing]
category: township-government

summary: >
  A 13-member commission appointed by the Township Council. It implements
  the township's Affordable Housing Strategy and monitors its progress.
powers:
  # From the commission's pages.
  - Implement Montclair Township's Affordable Housing Strategy
  - Monitor the township's efforts on affordable housing
limits:
  - null   # TO VERIFY

how_seated: >-
  Appointed by the Township Council to staggered three-year terms, after
  submitting the Township Clerk's volunteer form. One member is a Montclair
  high school student and one a Montclair State University student; both
  are nonvoting interns serving one-year terms.
seated_source: { title: "Housing Commission Members (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Housing-Commission/Housing-Commission-Members" }
appointed_by: The Township Council
reports_to: null
member_terms: 3 years; student members 1 year

members:
  # The page names six members for a 13-member commission.
  - { name: Deirdre Malloy, role: Chair }
  - { name: Alan Cohen,     role: Member }
  - { name: Antonio Gary,   role: Member }
  - { name: Kate Albright,  role: Member }
  - { name: Wendy McNeill,  role: Member }
  - { name: William Scott,  role: Member }
  - { name: Mayor Dr. Renee Baskerville, role: Councilor liaison }
  - { name: Aminah Toler,   role: "Councilor liaison (4th Ward)" }
roster_as_of: 2026-10-16

professionals:
  - { name: Janice Talley, role: "Staff liaison; Director of Planning and Community Development" }
  - { name: Cynthia McLeod-Blue, role: Staff housing specialist }
  - { name: "Acuity Consulting Services, LLC", role: Administrative agent }

notes:
  - title: Who it works with
    body: >-
      The commission works closely with local non-profit housing
      organizations, including HOMECorp and the Essex Community Land Trust.
    sources:
      - { title: "Housing Commission (township page)", url: "https://www.montclairnjusa.org/Government/Advisory-Committee-Boards-and-Commissions/Housing-Commission" }

